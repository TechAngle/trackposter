name: Versioning

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    needs: [testing]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          mode: "COMMIT"
          configuration: ".github/release-builder.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%y.%-m.%-d)
          LATEST_TAG=$(git tag -l "$DATE-*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            BUILD=1
          else
            OLD_BUILD=${LATEST_TAG#*-}
            BUILD=$((OLD_BUILD + 1))
          fi
          NEW_TAG="$DATE-$BUILD"

          gh release create $NEW_TAG \
            --title "Release $NEW_TAG" \
            --generate-notes
